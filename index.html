<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBECODE // Прайс-калькулятор</title>
    <!-- Подключаем надёжную сборку Tailwind -->
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0D1117; }
        /* Стиль для активной аккуратной полоски с мягкой неоновой подсветкой */
        .active-row { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.05); }
    </style>
</head>
<body class="text-gray-200 min-h-screen pb-24">

    <!-- ФИКСИРОВАННАЯ ШАПКА СО СЧЕТЧИКОМ В ПРАВОМ ВЕРХНЕМ УГЛУ -->
    <header class="sticky top-0 z-50 bg-[#161B22]/90 backdrop-blur-md border-b border-gray-800 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-wider text-white">VIBECODE</h1>
                <p class="text-xs text-indigo-400">веб-разработка на максималках</p>
            </div>
            <!-- Счётчик в правом углу -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl px-5 py-2.5 text-right">
                <span class="text-xs text-gray-400 block font-medium uppercase tracking-wider mb-0.5">Итог:</span>
                <span id="top_days" class="text-sm font-semibold text-purple-400 mr-2">1 день</span>
                <span id="top_price" class="text-2xl font-black text-indigo-400">2 000</span>
                <span class="text-indigo-400 font-bold text-lg"> ₽</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-12 space-y-10">
        
        <!-- БЛОК 1: ТИП САЙТА -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 pl-1">01 // ТИП ПРОЕКТА</h2>
            <div class="space-y-2">
                <label id="label-landing" class="active-row flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="site_type" value="landing" checked class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">Лендинг</span>
                            <span class="text-xs text-gray-400">Одностраничный сайт для теста ниши или товара</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">2 000 ₽</span>
                </label>

                <label id="label-corporate" class="flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="site_type" value="corporate" class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">Бизнес-сайт</span>
                            <span class="text-xs text-gray-400">Многостраничный сайт компании с услугами</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">5 000 ₽</span>
                </label>

                <label id="label-service" class="flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="site_type" value="service" class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">Сложный сервис</span>
                            <span class="text-xs text-gray-400">Личные кабинеты, каталоги или магазины</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">10 000 ₽</span>
                </label>
            </div>
        </div>

        <!-- БЛОК 2: СТИЛЬ -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 pl-1">02 // ВИЗУАЛЬНЫЙ СТИЛЬ</h2>
            <div class="space-y-2">
                <label id="label-minimal" class="active-row flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="design_style" value="minimal" checked class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">Чистый минимализм</span>
                            <span class="text-xs text-gray-400">Строгий, аккуратный дизайн по проверенным сеткам</span>
                        </div>
                    </div>
                    <span class="font-bold text-emerald-400 text-sm">Бесплатно</span>
                </label>

                <label id="label-custom" class="flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="design_style" value="custom" class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">Уникальный вайб</span>
                            <span class="text-xs text-gray-400">Индивидуальный стиль, кастомная графика и шрифты</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">+1 500 ₽</span>
                </label>
            </div>
        </div>
        <!-- БЛОК 3: ФИЧИ -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 pl-1">03 // ДОПОЛНИТЕЛЬНЫЕ ОПЦИИ</h2>
            <div class="space-y-2">
                <label id="label-animation" class="flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="feature_animation" class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">🔥 Сложные анимации</span>
                            <span class="text-xs text-gray-400">Плавные эффекты при скролле страниц</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">+1 000 ₽</span>
                </label>

                <label id="label-tg" class="flex justify-between items-center bg-[#161B22] border border-gray-800 p-4 rounded-xl cursor-pointer hover:border-gray-700 transition-all">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="feature_tg" class="w-4 h-4 accent-indigo-500" onchange="updateSelection()">
                        <div>
                            <span class="font-semibold text-white block">📊 Интеграция с Telegram</span>
                            <span class="text-xs text-gray-400">Заявки моментально летят тебе в мессенджер</span>
                        </div>
                    </div>
                    <span class="font-bold text-indigo-400 text-sm">+1 500 ₽</span>
                </label>
            </div>
        </div>

        <!-- ФОРМА ОТПРАВКИ -->
        <div class="bg-[#161B22] border border-gray-800 rounded-2xl p-6 text-center space-y-4">
            <p class="text-sm text-gray-400">Для заказа проекта напишите напрямую вайбкодеру в Telegram:</p>
            <div class="max-w-sm mx-auto flex gap-2">
                <input type="text" id="client_tg" placeholder="@твой_логин" class="w-full bg-[#0D1117] border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <button onclick="updateSelection(); alert('Вайб пойман! Скоро спишемся!')" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold px-6 py-3 rounded-xl transition-all cursor-pointer whitespace-nowrap text-sm">
                    НАПИСАТЬ
                </button>
            </div>
        </div>

    </main>

    <!-- ЛОГИКА СЧЕТЧИКА И ДИНАМИКИ -->
    <script>
        function updateSelection() {
            // Базовые значения
            const types = {
                landing: { price: 2000, days: 1 },
                corporate: { price: 5000, days: 3 },
                service: { price: 10000, days: 5 }
            };

            const selectedType = document.querySelector('input[name="site_type"]:checked').value;
            let price = types[selectedType].price;
            let days = types[selectedType].days;

            const selectedStyle = document.querySelector('input[name="design_style"]:checked').value;
            if (selectedStyle === 'custom') {
                price += 1500;
                days += 1;
            }

            if (document.getElementById('feature_animation').checked) {
                price += 1000;
                days += 1;
            }
            if (document.getElementById('feature_tg').checked) {
                price += 1500;
                days += 1;
            }

            // Обновляем текст в шапке (правый верхний угол)
            document.getElementById('top_price').innerText = price.toLocaleString('ru-RU');
            let daysWord = 'дней';
            if (days === 1) daysWord = 'день';
            else if (days > 1 && days < 5) daysWord = 'дня';
            document.getElementById('top_days').innerText = `${days} ${daysWord}`;

            // Сброс и подсветка активных строк (как в твоем прайсе)
            const allLabels = document.querySelectorAll('main label');
            allLabels.forEach(label => label.classList.remove('active-row'));

            // Подсвечиваем только выбранные
            document.getElementById(`label-${selectedType}`).classList.add('active-row');
            document.getElementById(`label-${selectedStyle}`).classList.add('active-row');
            
            if (document.getElementById('feature_animation').checked) document.getElementById('label-animation').classList.add('active-row');
            if (document.getElementById('feature_tg').checked) document.getElementById('label-tg').classList.add('active-row');
        }

        // Запуск при старте для базового подсчета
        updateSelection();
    </script>
</body>
</html>
